# next build (output: "export") 가 만든 out/ 을 서빙한다.
# 각 설정의 근거는 DEPLOY.md 참고.

map $uri $cache_control {
    default                            "public, max-age=86400";
    ~^/_next/static/                   "public, max-age=31536000, immutable";

    # pagefind-entry.json 이 해시된 색인 파일을 가리키는데, 배포하면 옛 색인은 삭제된다.
    # 캐시되면 사라진 파일을 요청해 검색이 깨지므로 재검증시킨다.
    ~^/pagefind/                       "no-cache";
    # 서비스 워커 및 HTML/RSC/매니페스트는 새 배포가 즉시 감지되어야 하므로 no-cache 로 재검증한다.
    ~^/build-version\.json$             "no-store";
    ~^/sw\.js$                         "no-cache";
    ~*\.(?:html|txt|xml|webmanifest)$  "no-cache";
}

server {
    # listen [::]:8080 을 더하면 IPv6 를 끈 호스트에서 nginx 가 기동하지 못한다.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;

    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/manifest+json
        image/svg+xml;

    # 'unsafe-inline' 은 제거할 수 없다. 조이면 하이드레이션이 죽는다.
    # 'wasm-unsafe-eval' 은 Pagefind 검색 엔진(WebAssembly)용이다. eval() 은 계속 막힌다.
    # giscus·GA4 를 켤 때 추가할 출처도 README 에 있다.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'" always;
    add_header X-Content-Type-Options "nosniff" always;

    # TLS 를 이 서버에서 끝낼 때만 켠다. 평문 HTTP 로 접근하는 홈랩에서 켜면
    # 브라우저가 기억해버려 해당 호스트에 다시 접속하지 못한다.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # add_header 는 상속이 아니라 대체다. location 안에서 쓰면 위 헤더가 전부 사라진다.
    add_header Cache-Control $cache_control always;

    location / {
        try_files $uri $uri/ =404;
    }

    # nginx 의 mime.types 에 webmanifest 항목이 없다. server 레벨 types 블록은
    # mime.types 전체를 대체해버리므로 이 경로에서만 지정한다.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
