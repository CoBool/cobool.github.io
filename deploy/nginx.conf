# True Log 정적 배포용 nginx 설정.
# next build (output: "export") 가 만든 out/ 을 그대로 서빙한다.

# 캐시 정책을 map 으로 계산해 server 블록에서 한 번만 add_header 한다.
# nginx 의 add_header 는 상속이 아니라 대체라, location 안에서 한 번이라도 쓰면
# 상위 블록의 add_header 가 전부 사라져 보안 헤더가 조용히 빠진다.
map $uri $cache_control {
    # public/ 에서 온 이미지·폰트. 내용 해시가 없어 영구 캐시하면 교체할 방법이 없다.
    default                            "public, max-age=86400";

    # 파일명에 내용 해시나 빌드 ID 가 들어가므로 영구 캐시해도 안전하다.
    ~^/_next/static/                   "public, max-age=31536000, immutable";

    # HTML 과 RSC 페이로드(.txt) 는 경로 기반 이름이라 배포해도 이름이 그대로고 내용만 바뀐다.
    # 캐시되면 새 배포 뒤에도 옛 페이로드로 내비게이션한다. 홈 1회 로드에 .txt 56개가
    # 프리페치되므로 영향이 크다. robots.txt·sitemap.xml·rss.xml 도 같은 이유로 여기 걸린다.
    ~*\.(?:html|txt|xml|webmanifest)$  "no-cache";
}

server {
    # IPv6 를 끈 호스트·컨테이너에서 listen [::]:8080 은 nginx 기동 자체를 실패시킨다.
    # 바깥 IPv6 는 도커의 포트 게시나 앞단 리버스 프록시가 처리한다.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 앞단에 리버스 프록시가 있을 때 리다이렉트에 내부 포트(8080)가 새지 않게 한다.
    absolute_redirect off;

    server_tokens off;

    # 한글 본문이 깨지지 않도록 charset 을 붙인다. text/html 은 기본 포함이라 적지 않는다.
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    # text/html 은 항상 포함이라 적지 않는다. 이미 압축된 png·woff2 는 넣지 않는다.
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/manifest+json
        image/svg+xml;

    # ── 보안 헤더 ──────────────────────────────────────────────
    # 정적 export 라 nonce 를 발급할 서버가 없고(공식 문서: "Static pages are generated
    # at build time ... so no nonce can be injected"), Next 는 RSC 페이로드를 페이지마다
    # 다른 인라인 <script> 로 심어 해시도 고정할 수 없다. experimental.sri 는 외부 파일에만
    # integrity 를 붙일 뿐 인라인 15개는 그대로라, script-src 'self' 로 조이면 하이드레이션이 죽는다.
    # 남는 방어는 외부 출처 스크립트 차단이고, 본문 HTML 은 rehype-sanitize 를 거친다.
    #
    # giscus 를 켰다면:  script-src ... https://giscus.app / frame-src https://giscus.app
    # GA4 를 켰다면:    script-src ... https://www.googletagmanager.com
    #                  connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

    # .txt 를 113개 서빙하므로 내용 기반 타입 추측을 끄는 것이 특히 중요하다.
    add_header X-Content-Type-Options "nosniff" always;

    # 본문에서 외부로 나가는 링크에 전체 URL 이 아니라 출처만 넘긴다.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 블로그가 쓸 일 없는 권한을 페이지와 그 안의 iframe 에서 봉인한다.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 외부 링크로 열린 창이 window.opener 로 원래 탭을 바꿔치기하는 것을 막는다.
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # TLS 를 이 서버에서 끝낼 때만 켠다. 평문 HTTP 로 접근하는 홈랩 LAN 에서 켜면
    # 브라우저가 기억해버려 해당 호스트에 다시 접속하지 못한다.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header Cache-Control $cache_control always;

    # trailingSlash: true 이므로 /posts/foo/ → /posts/foo/index.html.
    # 슬래시 없는 /posts/foo 는 nginx 가 /posts/foo/ 로 301 한다.
    location / {
        try_files $uri $uri/ =404;
    }

    # nginx 의 mime.types 에 webmanifest 항목이 없어 application/octet-stream 으로 나가고,
    # nosniff 와 겹치면 브라우저가 매니페스트를 거부할 수 있다. server 레벨 types 블록은
    # 상속이 아니라 mime.types 전체를 대체해버리므로 이 경로에서만 타입을 지정한다.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Dockerfile 의 HEALTHCHECK 가 찌르는 경로. 디스크를 건드리지 않는다.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
