# True Log 정적 배포용 nginx 설정.
# next build (output: "export") 가 만든 out/ 을 그대로 서빙한다.

# 캐시 정책을 map 으로 계산해 server 블록에서 한 번만 add_header 한다.
# location 안에서 add_header 를 쓰면 상위 블록의 add_header 가 전부 사라지므로
# (nginx 의 add_header 는 상속이 아니라 대체다) 보안 헤더가 조용히 빠진다.
map $uri $cache_control {
    # public/ 에서 온 이미지·폰트 등. 내용 해시가 없어 영구 캐시는 위험하다.
    default                             "public, max-age=86400";

    # 파일명에 내용 해시나 빌드 ID 가 들어가므로 영구 캐시해도 안전하다.
    ~^/_next/static/                    "public, max-age=31536000, immutable";

    # HTML 과 RSC 페이로드(.txt) 는 경로 기반 이름이라 배포마다 내용만 바뀐다.
    # 캐시되면 새 배포 뒤에도 옛 페이로드가 나가 화면이 어긋난다.
    # robots.txt·sitemap.xml·rss.xml 도 같은 이유로 여기에 걸린다.
    ~*\.(?:html|txt|xml|webmanifest)$   "no-cache";
}

server {
    # IPv6 를 끈 호스트·컨테이너에서 listen [::]:8080 은 nginx 기동 자체를 실패시킨다.
    # 바깥 IPv6 는 도커의 포트 게시나 앞단 리버스 프록시가 처리한다.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 앞단에 리버스 프록시가 있을 때 리다이렉트에 내부 포트(8080)가 새지 않게 한다.
    absolute_redirect off;

    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/rss+xml;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/rss+xml
        application/manifest+json
        image/svg+xml;

    # ── 보안 헤더 ──────────────────────────────────────────────
    # 정적 export 라 nonce 를 발급할 서버가 없다. Next 는 RSC 페이로드를
    # 페이지마다 다른 인라인 <script> 로 심으므로 해시도 쓸 수 없어
    # script-src 에 'unsafe-inline' 이 강제된다. 그래도 외부 출처 스크립트
    # 로딩은 계속 막히고, 본문 HTML 은 rehype-sanitize 를 거친다.
    #
    # giscus 댓글을 켰다면 아래에 추가:
    #   script-src  ... https://giscus.app
    #   frame-src   https://giscus.app
    # GA4 를 켰다면 아래에 추가:
    #   script-src  ... https://www.googletagmanager.com
    #   connect-src ... https://*.google-analytics.com https://*.analytics.google.com
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # TLS 를 이 서버에서 끝낼 때만 켠다. 평문 HTTP 로 접근하는 홈랩 LAN 에서
    # 켜면 해당 호스트에 다시 접속하지 못한다.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header Cache-Control $cache_control always;

    # trailingSlash: true 이므로 /posts/foo/ → /posts/foo/index.html.
    # 슬래시 없는 /posts/foo 는 nginx 가 /posts/foo/ 로 301 한다.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
