name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 실패한 실행을 다시 돌리거나 기본 브랜치를 수동으로 검증할 때 사용한다.
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 진행 중이던 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # packageManager 필드(pnpm@11.9.0)에서 버전을 읽으므로 별도 고정이 필요 없다.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # package.json 의 engines 와 같은 메이저를 쓴다.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
