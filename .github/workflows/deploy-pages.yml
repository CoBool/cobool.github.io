name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩 끝까지 돌린다. 진행 중인 배포를 자르면 페이지가 중간 상태로 남는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # packageManager 필드(pnpm@11.9.0)에서 버전을 읽으므로 별도 고정이 필요 없다.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # main 에 직접 밀어넣은 커밋도 배포되므로, 내보내기 전에 여기서 다시 확인한다.
      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # 절대 URL(canonical·Open Graph·sitemap·RSS)의 기준. Pages 가 알려준 주소를 그대로 쓴다.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      # Actions 배포 경로는 Jekyll 을 돌리지 않으므로 .nojekyll 이 필요 없다.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
